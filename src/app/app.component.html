
<ng-container *ngIf="(updateService.updateData$ | async) as data">
  <app-updates [updateData]="data"></app-updates>
</ng-container>



<ng-container>
  <div>
    <app-top-navbar></app-top-navbar>
    <app-content-area  [@routeAnimations]="prepareRoute(outlet)">
      <router-outlet #outlet="outlet"></router-outlet>
    </app-content-area>
    <app-bottom-navbar></app-bottom-navbar> 
    <app-custom-modal></app-custom-modal>
    <app-alert-modal></app-alert-modal>
  </div>
</ng-container>
